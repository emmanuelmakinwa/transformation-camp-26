<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Reset Admin Password | Transformation Camp</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="login-page">
  <main class="login-card">
    <img src="/images/transformation-camp-logo.png" alt="Transformation Camp" class="brand">
    <p class="eyebrow">ACCOUNT SECURITY</p>
    <h1>Set a new password</h1>
    <p class="muted">Choose a new password for your authorized administrator account.</p>
    <form id="reset-form" hidden>
      <label for="password">New password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required minlength="10" maxlength="128">
      <label for="confirm-password">Confirm new password</label>
      <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" required minlength="10" maxlength="128">
      <p id="message" class="message" role="alert" aria-live="polite"></p>
      <button id="submit" type="submit">Update password</button>
    </form>
    <p id="status" class="message" role="status" aria-live="polite">Checking your secure reset link…</p>
    <a class="back-link" href="/admin/login">← Back to admin login</a>
  </main>
  <script src="/admin/reset-password.js" defer></script>
</body>
</html>
